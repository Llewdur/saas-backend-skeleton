; Supervisor config for Laravel Horizon.
;
; Install:
;   sudo apt-get install -y supervisor
;   sudo cp deploy/supervisor/horizon.conf /etc/supervisor/conf.d/horizon.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start horizon
;
; Replace /var/www/saas-backend-skeleton with the production install path,
; and `deploy` with the OS user that owns the app files.
;
; Horizon expects a graceful shutdown signal — `stopsignal=SIGTERM` plus a
; generous `stopwaitsecs` lets in-flight jobs finish before the worker dies.

[program:horizon]
process_name=%(program_name)s
command=php /var/www/saas-backend-skeleton/artisan horizon
autostart=true
autorestart=true
user=deploy
redirect_stderr=true
stdout_logfile=/var/log/horizon.log
stopwaitsecs=3600
stopsignal=SIGTERM
